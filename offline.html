<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f9fafb; color: #111827; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
      .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.06); }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0; color: #4b5563; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; color: #16a34a; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>You’re offline</h1>
        <p>This page isn’t available right now. Please check your internet connection and try again.</p>
        <a href="/">Try again</a>
      </div>
    </div>
  </body>
</html>
